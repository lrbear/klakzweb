<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b12"><title>Kaynak paylaş — KLAKZWEB</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="app.js"></script></head><body data-page="upload"><div id="site-header"></div><main class="shell page-main narrow"><div class="page-intro"><div class="eyebrow">TOPLULUĞA KATKI</div><h1>Bir kaynak <span>paylaş.</span></h1><p>Gönderin moderasyon onayından sonra herkese açık olur. Yalnızca gerçekten oluşturduğun veya paylaşmaya hakkın olan içerikleri gönder.</p></div><div id="upload-connect-note" class="notice hidden"></div><form id="upload-form" class="panel form-panel"><div class="form-row"><label>Kaynak başlığı *<input name="title" required minlength="3" maxlength="80" placeholder="Kaynağın açıklayıcı adı"></label><label>Oyun / konu *<input name="game" required maxlength="50" placeholder="Örn. Minecraft"></label></div><div class="form-row"><label>Tür *<select name="category" required><option value="Mod">Mod</option><option value="Araç">Araç</option><option value="Rehber">Rehber</option><option value="Kod">Kod</option></select></label><label>Etiketler<input name="tags" maxlength="160" placeholder="virgülle ayır: başlangıç, rehber"></label></div><label>Kısa açıklama *<textarea name="description" required minlength="10" maxlength="500" rows="4" placeholder="Ne işe yarar, hangi sürümle uyumlu, nasıl kullanılır?"></textarea></label><label>Kaynak bağlantısı<input name="link" type="url" maxlength="500" placeholder="https://… (isteğe bağlı)"></label><label>Kod içeriği<textarea name="code" id="code-editor" class="code-editor" maxlength="50000" rows="12" spellcheck="false" placeholder="Kodunu buraya ekleyebilirsin. Bu alan isteğe bağlıdır."></textarea></label><div class="editor-toolbar"><span id="code-lines">0 satır</span><button type="button" class="btn small ghost" id="copy-editor">Kodu kopyala ⧉</button></div><label class="check-label"><input type="checkbox" name="rights" required> Bu içeriği paylaşma hakkım olduğunu ve kurallara uyduğunu onaylıyorum.</label><button class="btn primary full" type="submit">Moderasyona gönder ↗</button><p id="upload-message" class="form-message" role="status"></p><p class="fine-print">Gönderiler varsayılan olarak beklemede kalır. Yönetici onaylamadan keşfet sayfasında görünmez.</p></form></main><div id="site-footer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
